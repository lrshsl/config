# Performance
backend = "glx"; # Use openGL (GPU)
vsync = true;
use-damage = true; # Redraw only changed parts of the screen

# Opacity
frame-opacity = 1.0;

# Blur
#blur-kern = "3x3box";


detect-rounded-corners = true;
detect-client-opacity = true;
#detect-transient = true;

# Shadows
shadow = false;

# Corners
corner-radius = 12;


# Animations
animations = true;

rules = (
  # Normal windows (Smooth morphing on move/resize + Fade appear/disappear)
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.22;
      },
      {
        triggers = [ "open", "show" ];
        preset = "appear";
        duration = 0.2;
      },
      {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        duration = 0.2;
      }
    );
  },

  # Notifications (Slide in/out from the right edge smoothly)
  {
    match = "window_type = 'notification' || class_g = 'Dunst' || class_g = 'Mako'";
    animations = (
      {
        triggers = [ "open", "show" ];
        opacity = { duration = 1.25; start = 0.0; end = 1.0; };
        offset-x = {
          curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
          duration = 1.25;
          start = "window-width"; # Starts off-screen to the right by its own width
          end = 0;
        };
        crop-x = "window-x";
        crop-y = "window-y";
        crop-width = "window-width";
        crop-height = "window-height";
      },
      {
        triggers = [ "close", "hide" ];
        opacity = { duration = 1.2; start = 1.0; end = 0.0; };
        offset-x = {
          curve = "linear";
          duration = 1.2;
          start = 0;
          end = "window-width"; # Slides right off-screen
        };
        crop-x = "window-x";
        crop-y = "window-y";
        crop-width = "window-width";
        crop-height = "window-height";
      }
    );
  },

  # Dropdowns & menus (Slide down/up from the top)
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu'";
    animations = (
      {
        triggers = [ "open", "show" ];
        opacity = { duration = 2.15; start = 0.0; end = 1.0; };
        offset-y = {
          curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
          duration = 2.18;
          start = "-window-height"; # Starts hidden just above its anchor point
          end = 0;
        };
        crop-x = "window-x";
        crop-y = "window-y";
        crop-width = "window-width";
        crop-height = "window-height";
      },
      {
        triggers = [ "close", "hide" ];
        opacity = { duration = 2.15; start = 1.0; end = 0.0; };
        offset-y = {
          curve = "linear";
          duration = 2.15;
          start = 0;
          end = "-window-height";
        };
        crop-x = "window-x";
        crop-y = "window-y";
        crop-width = "window-width";
        crop-height = "window-height";
      }
    );
  },

  # Other utility windows (rofi, tooltips, modals - completely instant)
  {
    match = "window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'utility' || window_type = 'dialog' || class_g = 'Rofi' || class_g = 'dmenu'";
    animations = (); # None
  }
)
