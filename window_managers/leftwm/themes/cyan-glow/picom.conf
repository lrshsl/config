# Performance
backend = "glx"; # Use openGL (GPU)
vsync = true;
use-damage = true; # Redraw only changed parts of the screen

# Opacity
frame-opacity = 1.0;

# Blur
#blur-kern = "3x3box";


detect-rounded-corners = true;
detect-client-opacity = true;
#detect-transient = true;

# Shadows
shadow = false;

# Corners
corner-radius = 12;


# Animations
animations = true;

rules = (
  # Normal windows
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.2;
      },
      {
        triggers = [ "open", "show" ];
        preset = "appear";
        duration = 0.2;
      },
      {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        duration = 0.2;
      }
    );
  },

  # Notifications: Slide in/out from the right
  {
    match = "window_type = 'notification' || class_g = 'Dunst' || class_g = 'Mako'";
    animations = (
      {
        triggers = [ "open", "show" ];
        preset = "slide-in";
        direction = "right";
        duration = 0.3;
      },
      {
        triggers = [ "close", "hide" ];
        preset = "slide-out";
        direction = "right";
        duration = 0.3;
      }
    );
  },

  # Dropdowns: Slide in/out from the top
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu'";
    animations = (
      {
        triggers = [ "open", "show" ];
        preset = "slide-in";
        direction = "down";
        duration = 0.18;
      },
      {
        triggers = [ "close", "hide" ];
        preset = "slide-out";
        direction = "down";
        duration = 0.18;
      }
    );
  },

  # Other small windows (rofi, popups, utility menus, etc.): No animation
  {
    match = "window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'utility' || window_type = 'dialog' || class_g = 'Rofi' || class_g = 'dmenu'";
    animations = (
      {
        triggers = [ "open", "show", "close", "hide", "geometry" ];
        preset = "appear";
        duration = 0.0;
      }
    );
  }
)
