[colors]
background = #1a1b26
background-alt = #24283b
foreground = #a9b1d6
primary = #7aa2f7
secondary = #bb9af7
alert = #f7768e
disabled = #565f89

[bar/top]
# This allows the launch script to set the monitor dynamically
monitor = ${env:MONITOR:}
width = 100%
height = 20pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
padding-left = 1
padding-right = 2
module-margin = 1

# Make sure you have 'otf-font-awesome' or 'ttf-jetbrains-mono-nerd'
font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = xworkspaces
modules-center = date
modules-right = backlight pulseaudio battery wlan

cursor-click = pointer
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
# This works perfectly with Pipewire-Pulse
use-ui-max = false
format-volume = <label-volume>
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
label-muted = "MUTED"
label-muted-foreground = ${colors.disabled}

[module/backlight]
type = internal/backlight
card = nvidia_wmi_ec_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = "BRI "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT1
# If CHG/BAT status doesn't update, try changing ACAD to ADP1 or AC
adapter = ACAD
poll-interval = 5
format-charging = <label-charging>
format-charging-prefix = "CHG "
format-charging-prefix-foreground = ${colors.secondary}
format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.primary}
label-charging = %percentage%%
label-discharging = %percentage%%

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 5
format-connected = <label-connected>
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${colors.primary}
# Shows SSID; click it in your bar to see more if you add actions
label-connected = %essid%
label-disconnected = "OFFLINE"
label-disconnected-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
